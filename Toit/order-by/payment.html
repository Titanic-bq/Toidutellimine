<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Payment</h2>

      <label>Card Number</label>
      <input type="text" placeholder="1234 5678 9012 3456" />

      <label>Expiry Date</label>
      <input type="month" />

      <label>CVV</label>
      <input type="password" placeholder="123" />

      <button class="btn">Pay Now</button>
    </div>
  </body>
</html>
