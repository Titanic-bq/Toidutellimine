<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Choose Food</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container scroll">
      <h2>Menu</h2>

      <div class="food-grid">
        <!-- PRODUCT 1 -->
        <div class="food-card">
          <img
            src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092"
          />
          <span class="food-name">Pizza</span>
          <span class="food-price">$12.99</span>
          <button>Add</button>
        </div>

        <!-- PRODUCT 2 -->
        <div class="food-card">
          <img
            src="https://images.unsplash.com/photo-1550547660-d9450f859349"
          />
          <span class="food-name">Burger</span>
          <span class="food-price">$9.99</span>
          <button>Add</button>
        </div>

        <!-- PRODUCT 3 -->
        <div class="food-card">
          <img
            src="https://images.unsplash.com/photo-1621996346565-e3dbc353d2e5"
          />
          <span class="food-name">Pasta</span>
          <span class="food-price">$11.50</span>
          <button>Add</button>
        </div>

        <!-- PRODUCT 4 -->
        <div class="food-card">
          <img
            src="https://images.unsplash.com/photo-1576107232684-1279f390859f"
          />
          <span class="food-name">Fries</span>
          <span class="food-price">$4.50</span>
          <button>Add</button>
        </div>

        <!-- PRODUCT 5 -->
        <div class="food-card">
          <img
            src="https://images.unsplash.com/photo-1581006852262-e4307cf6283a"
          />
          <span class="food-name">Drink</span>
          <span class="food-price">$2.99</span>
          <button>Add</button>
        </div>
      </div>

      <a href="payment.html" class="btn">Go to Payment</a>
    </div>
  </body>
</html>
